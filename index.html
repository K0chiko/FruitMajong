<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Фрукты">
<meta name="theme-color" content="#5aa9e6">
<title>Фруктовый маджонг</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#2b5f8f;overscroll-behavior:none;touch-action:manipulation;
  font-family:"SF Pro Rounded","Avenir Next Rounded",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif}
#game{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;background:#2b5f8f;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 4px;position:relative;z-index:3}
#coinPill{display:flex;align-items:center;gap:6px;background:rgba(40,60,100,.55);border-radius:20px;padding:3px 14px 3px 4px;min-width:96px}
#coinIcon{font-size:26px;line-height:1;display:inline-block}
#coins{color:#fff;font-size:20px;font-weight:800}
#coinPill.bump #coinIcon{animation:bump .35s}
#coinPill.nope{animation:shake .4s}
#title{color:#fff;font-size:28px;font-weight:900;text-shadow:0 2px 0 rgba(30,50,110,.55),0 3px 8px rgba(0,0,0,.25);letter-spacing:.5px}
.sp{width:96px}
#tray{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:8px 10px 0;padding:7px;border-radius:18px;
  background:rgba(40,60,110,.6);box-shadow:inset 0 3px 8px rgba(0,0,0,.35),0 0 0 3px rgba(255,255,255,.35);position:relative;z-index:3}
.slot{aspect-ratio:1/1.12;border-radius:12px;background:rgba(20,35,80,.55)}
#boardArea{flex:1;margin:8px 8px 0;position:relative;min-height:0}
#bar{display:flex;justify-content:center;align-items:center;gap:12px;padding:8px 0 12px;position:relative;z-index:3}
.btn{position:relative;width:64px;height:64px;border-radius:22px;border:0;color:#fff;font-size:30px;cursor:pointer;
  background:linear-gradient(#58b4ff,#2c7be0);box-shadow:0 5px 0 #1c4fa0,0 8px 12px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;
  transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #1c4fa0}
.btn.dim{filter:grayscale(.6) brightness(.8)}
.btn.small{width:50px;height:50px;border-radius:50%;font-size:24px;background:linear-gradient(#b8c0cc,#7f8a9a);box-shadow:0 4px 0 #566070,0 6px 10px rgba(0,0,0,.3)}
.badge{position:absolute;right:-6px;bottom:-6px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:#e8453c;color:#fff;
  font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #fff}
.badge.cost{background:#f5b82e;color:#5a3a00;box-shadow:0 0 0 2px #fff}
#stage{position:absolute;inset:0;pointer-events:none;z-index:2}
.tile{position:absolute;border-radius:16%;background:linear-gradient(#fff 40%,#e9eef6);display:flex;align-items:center;justify-content:center;
  box-shadow:0 .08em 0 #aab6ca,0 .16em .3em rgba(0,0,0,.3);pointer-events:auto;line-height:1;
  transition:left .3s cubic-bezier(.3,.9,.3,1),top .3s cubic-bezier(.3,.9,.3,1),width .3s,height .3s,font-size .3s;
  animation:popin .35s backwards}
.tile img{width:82%;height:82%;object-fit:contain;image-rendering:pixelated;pointer-events:none;filter:drop-shadow(0 .04em .03em rgba(0,0,0,.3))}
.tile.blocked::after{content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(40,55,100,.4);pointer-events:none}
.tile.vanish{animation:vanish .28s forwards;pointer-events:none}
.tile.shake{animation:shake .3s}
.tile.hint{animation:pulse .6s 3;box-shadow:0 0 0 .1em #ffd23f,0 0 .6em .2em rgba(255,210,63,.9)}
@keyframes popin{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes vanish{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(0);opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pulse{50%{transform:scale(1.14)}}
@keyframes bump{50%{transform:scale(1.5) rotate(15deg)}}
.fx{position:absolute;pointer-events:none;z-index:4;font-size:22px;will-change:transform,opacity}
#overlay{position:absolute;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(10,20,50,.5)}
#overlay.on{display:flex}
.card{background:linear-gradient(#fff,#e7f0ff);border-radius:28px;padding:26px 30px;text-align:center;width:78%;max-width:340px;
  box-shadow:0 8px 0 #9db3d8,0 16px 40px rgba(0,0,0,.4);animation:popin .35s}
.card h2{margin:0 0 6px;font-size:28px;color:#24477f}
.card p{margin:0 0 18px;color:#4a5f85;font-size:17px}
.card .btn{width:100%;height:56px;font-size:21px;font-weight:800;border-radius:18px}
#banner{position:absolute;left:0;right:0;top:38%;z-index:9;text-align:center;color:#fff;font-size:38px;font-weight:900;pointer-events:none;
  text-shadow:0 3px 0 #c2570c,0 5px 14px rgba(0,0,0,.4);display:none}
#banner.on{display:block;animation:popin .45s}
</style>

#coinPill{background:var(--barc) 0 0/100% 100% no-repeat;border-radius:0;min-width:118px;height:46px;padding:0 16px 0 8px}
#coinIcon{font-size:0;width:34px;height:34px;background:var(--coin) center/contain no-repeat;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
#coins{color:#fff;text-shadow:0 2px 0 rgba(40,30,20,.6)}
#title{background:var(--tape) 0 0/100% 100% no-repeat;width:196px;height:64px;display:flex;align-items:center;justify-content:center;
  font-size:23px;padding-bottom:6px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
#tray{background:none;border-radius:0;box-shadow:none;padding:10px 14px 12px;margin:14px 26px 0;z-index:1;isolation:isolate}
#tray::before{content:"";position:absolute;left:-8.5%;right:-8.5%;top:-23%;bottom:-39%;background:var(--bar) 0 0/100% 100% no-repeat;z-index:-1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.slot{background:rgba(120,85,50,.2);border-radius:10px;box-shadow:inset 0 2px 4px rgba(90,60,30,.35)}
.btn{box-shadow:none;border-radius:0;width:74px;height:64px;background:var(--green) 0 0/100% 100% no-repeat;font-size:28px;
  filter:drop-shadow(0 4px 4px rgba(0,0,0,.35))}
.btn:active{box-shadow:none;transform:translateY(3px)}
.btn.green:active{background-image:var(--greenA)}
.btn.red{background-image:var(--red)}.btn.red:active{background-image:var(--redA)}
.btn.small{width:58px;height:50px;background:var(--tan) 0 0/100% 100% no-repeat;border-radius:0;box-shadow:none;font-size:22px}
.btn.small:active{filter:brightness(.85)}
.btn.dim{filter:grayscale(.7) brightness(.85)}
.ar{width:36px;height:36px;background:var(--arrow) center/contain no-repeat;transform:scaleX(-1);filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.card{background:none;border-radius:0;box-shadow:none;padding:34px 30px 32px;max-width:340px;width:74%;position:relative;isolation:isolate}
.card::before{content:"";position:absolute;left:-5.4%;right:-5.4%;top:-8.4%;bottom:-14.1%;background:var(--card) 0 0/100% 100% no-repeat;z-index:-1;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}
.card h2{color:#5a3b1e}.card p{color:#7a5a38}
.card .btn{background:var(--btnL) 0 0/100% 100% no-repeat;width:100%;height:62px;color:#fff;text-shadow:0 2px 0 rgba(20,60,10,.6);filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.card .btn:active{background-image:var(--btnLA)}
.fx.coinfx{width:24px;height:24px;font-size:0;background:var(--coin) center/contain no-repeat}
#title,#coins{font-family:inherit}

.ic{display:block;width:32px;height:32px;margin-top:-4px;background-size:100% 100%;background-repeat:no-repeat;image-rendering:pixelated;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.btn.small .ic{width:28px;height:28px;margin-top:-2px}
.ic-undo{background-image:var(--i-arrow-left)}
.ic-hint{background-image:var(--i-search)}
.ic-mus{background-image:var(--i-music-on)}
.ic-snd{background-image:var(--i-sound-on)}
#bSnd.off .ic-snd{background-image:var(--i-sound-off)}
.ic-shuf{position:relative;width:32px;height:32px;background:none;filter:none}
.ic-shuf::before,.ic-shuf::after{content:"";position:absolute;width:24px;height:24px;background-size:100% 100%;image-rendering:pixelated;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.ic-shuf::before{left:8px;top:-2px;background-image:var(--i-arrow-right)}
.ic-shuf::after{left:0;top:12px;background-image:var(--i-arrow-left)}
.cn{display:inline-block;width:16px;height:16px;background:var(--coin) center/contain no-repeat;vertical-align:-3px;margin-right:2px}
.badge.cost{font-size:15px}
</style>
</head>
<body>
<div id="game">
  <div id="hdr">
    <div id="coinPill"><span id="coinIcon">🪙</span><b id="coins">0</b></div>
    <div id="title">Уровень 1</div>
    <div class="sp"></div>
  </div>
  <div id="tray"></div>
  <div id="boardArea"></div>
  <div id="bar">
    <button class="btn red" id="bUndo"><i class="ic ic-undo"></i><span class="badge" id="undoN">2</span></button>
    <button class="btn green" id="bHint"><i class="ic ic-hint"></i><span class="badge cost"><i class="cn"></i>30</span></button>
    <button class="btn green" id="bShuf"><i class="ic ic-shuf"></i><span class="badge cost"><i class="cn"></i>50</span></button>
    <button class="btn small" id="bMus"><i class="ic ic-mus"></i></button>
    <button class="btn small" id="bSnd"><i class="ic ic-snd"></i></button>
  </div>
  <div id="stage"></div>
  <div id="banner"></div>
  <div id="overlay"><div class="card"><h2>Лоток полон</h2><p>Попробуй ещё раз!</p><button class="btn" id="bRetry">Ещё раз</button></div></div>
</div>

let ac=null,musicBus=null,sfxBus=null,noiseBuf=null,silentEl=null;
function mkBus(vol,send,conv){
  const g=ac.createGain();g.gain.value=vol;g.connect(ac.destination);
  const s=ac.createGain();s.gain.value=send;g.connect(s);s.connect(conv);return g;
}

/* ---------- rng / level generation ---------- */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

const overlap=(a,b)=>Math.abs(a.x-b.x)<2&&Math.abs(a.y-b.y)<2;

function genLevel(n){
  const r=rng(n*7919+13);
  const target=Math.min(15+n*6,126);
  const layers=Math.max(2,Math.min(5,2+Math.floor(n/3)));
  const wts=[1,.75,.55,.4,.3].slice(0,layers), sumW=wts.reduce((a,b)=>a+b,0);
  let tiles=[];
  for(let z=0;z<layers;z++){
    const off=z%2, cols=6-off, rows=7-off, cands=[];
    for(let j=0;j<rows;j++)for(let i=0;i<=Math.floor((cols-1)/2);i++){
      const x=off+2*i, y=off+2*j, c={x,y,z};
      if(z>0&&!tiles.some(t=>t.z===z-1&&overlap(t,c))) continue;
      cands.push({x,y,xm:off+2*(cols-1-i),s:Math.hypot((x-5)/5,(y-6)/6)*.8+r()*.7});
    }
    cands.sort((a,b)=>a.s-b.s);
    const quota=Math.max(2,Math.round(target*wts[z]/sumW));
    let got=0;
    for(const c of cands){
      if(got>=quota) break;
      tiles.push({x:c.x,y:c.y,z}); got++;
      if(c.xm!==c.x){tiles.push({x:c.xm,y:c.y,z}); got++;}
    }
  }
  while(tiles.length%3){
    const mz=Math.max(...tiles.map(t=>t.z)), top=tiles.filter(t=>t.z===mz);
    tiles.splice(tiles.indexOf(top[Math.floor(r()*top.length)]),1);
  }
  // removal order (guarantees solvability), then types in chunks
  const rem=tiles.slice(), order=[];
  const free=t=>!rem.some(b=>b.z>t.z&&overlap(b,t));
  while(rem.length){
    const f=rem.filter(free), p=f[Math.floor(r()*f.length)];
    order.push(p); rem.splice(rem.indexOf(p),1);
  }
  const nT=Math.min(4+Math.floor(n/2),EMOJI.length);
  const pool=shuffle(EMOJI.slice(),r).slice(0,nT);
  const triples=order.length/3, seq=[];
  for(let i=0;i<triples;i++) seq.push(pool[i%nT]);
  shuffle(seq,r);
  const chunk=n<4?6:9;
  let ti=0;
  for(let s=0;s<order.length;s+=chunk){
    const L=Math.min(chunk,order.length-s), labels=[];
    for(let k=0;k<L/3;k++){const ty=seq[ti++];labels.push(ty,ty,ty);}
    shuffle(labels,r);
    for(let k=0;k<L;k++) order[s+k].type=labels[k];
  }
  return tiles;
}

    three.forEach(t=>{t.gone=true;t.el.classList.add('vanish');const p=center(t);burst(p.x,p.y);});
    sfx.match();
    S.coins+=MATCH_COINS;flyCoins(c.x,c.y,5);
    setTimeout(()=>{three.forEach(t=>t.el.remove());reflowTray();setTimeout(()=>{setCoins();after();},120);},280);
  }else after();
}
function after(){
  if(!board.length){win();return;}
  if(tray.length>=MAXSLOT){lose();return;}
  busy=false;
}
function win(){
  over=true;sfx.win();confetti();
  S.coins+=WIN_COINS;setCoins();bumpCoins();
  banner('Уровень пройден!');
  setTimeout(()=>{S.level++;save();startLevel();},1700);
}
function lose(){
  over=true;sfx.lose();
  $('#overlay').classList.add('on');
}

/* ---------- boosters ---------- */
function spend(c){
  if(S.coins<c){coinPill.classList.remove('nope');void coinPill.offsetWidth;coinPill.classList.add('nope');sfx.nope();return false;}
  S.coins-=c;setCoins();return true;
}
$('#bUndo').onclick=()=>{
  if(busy||over||undos<=0||!lastMove||!lastMove.inTray) return;
  const t=lastMove;tray.splice(tray.indexOf(t),1);t.inTray=false;board.push(t);lastMove=null;
  undos--;$('#undoN').textContent=undos;
  place(t);reflowTray();updateBlocked();sfx.undo();
};
$('#bHint').onclick=()=>{
  if(busy||over||!board.length) return;
  const fr=board.filter(t=>!t.blocked);
  let pick_=null;
  for(const tt of tray){const m=fr.find(t=>t.type===tt.type);if(m){pick_=m;break;}}
  if(!pick_){
    const c={};fr.forEach(t=>c[t.type]=(c[t.type]||0)+1);
    const best=Object.keys(c).sort((a,b)=>c[b]-c[a])[0];
    pick_=fr.find(t=>t.type===best)||fr[0];
  }
  if(!pick_||!spend(COST_HINT)) return;
  const e=pick_.el;e.classList.remove('hint');void e.offsetWidth;e.classList.add('hint');sfx.hint();
};
$('#bShuf').onclick=()=>{
  if(busy||over||board.length<2) return;
  if(!spend(COST_SHUF)) return;
  const ty=shuffle(board.map(t=>t.type),Math.random);
  board.forEach((t,i)=>{t.type=ty[i];t.el.firstChild.src=ty[i];t.el.classList.remove('vanish');
    t.el.animate([{transform:'rotate(0) scale(1)'},{transform:'rotate(180deg) scale(.7)'},{transform:'rotate(360deg) scale(1)'}],{duration:450});});
  sfx.shuffle();
};
$('#bSnd').onclick=()=>{S.sound=!S.sound;$('#bSnd').classList.toggle('off',!S.sound);save();};
$('#bMus').onclick=()=>{M.unlocked=true;S.music=!S.music;$('#bMus').classList.toggle('dim',!S.music);save();if(S.music)musicStart(M.want);else musicStop();};
$('#bRetry').onclick=startLevel;
$('#bMus').classList.toggle('dim',!S.music);
$('#bSnd').classList.toggle('off',!S.sound);

function relayout(){computeBoard();allTiles.filter(t=>!t.gone).forEach(t=>{t.el.style.transition='none';place(t);});void stage.offsetWidth;allTiles.forEach(t=>t.el.style.transition='');}
addEventListener('resize',relayout);
addEventListener('orientationchange',()=>setTimeout(relayout,200));
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

startLevel();
})();
</script>
</body>
</html>
